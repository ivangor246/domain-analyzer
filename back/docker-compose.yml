services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DEV_MODE: ${DEV_MODE:-False} # Set to True by make dev
    ports:
      - 8000:8000
    develop:
      watch:
        - action: sync
          path: ./src
          target: /project/src
