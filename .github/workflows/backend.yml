name: Backend

permissions:
  contents: read

on:
  push:
    paths:
      - 'back/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'back/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry==2.1.3

      - name: Check lock file
        working-directory: back
        run: poetry check --lock

      - name: Install backend dependencies
        working-directory: back
        run: poetry install --no-interaction

      - name: Run tests with coverage
        working-directory: back
        run: PYTHONPATH=src poetry run coverage run -m unittest discover -s tests && poetry run coverage report --fail-under=80

      - name: Check lint
        working-directory: back
        run: poetry run ruff check src tests

      - name: Check formatting
        working-directory: back
        run: poetry run ruff format --check src tests

      - name: Build backend image
        working-directory: back
        run: docker build --tag domain-analyzer-back:ci .

      - name: Prepare Compose smoke environment
        run: cp back/.env.example back/.env

      - name: Run Compose smoke test
        env:
          APP_PORT: 18000
          COMPOSE_PROJECT_NAME: domain-analyzer-back-ci
        run: sh scripts/compose-smoke.sh

      - name: Smoke test hardened backend image
        run: |
          set -eu
          docker run --detach \
            --name domain-analyzer-back-smoke \
            --publish 8000:8000 \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env DOCS=False \
            --env DEV_MODE=False \
            domain-analyzer-back:ci
          trap 'docker rm --force domain-analyzer-back-smoke' EXIT
          test "$(docker image inspect domain-analyzer-back:ci --format '{{.Config.User}}')" = "app"
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
