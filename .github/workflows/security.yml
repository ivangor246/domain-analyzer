name: Security

permissions:
  contents: read

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'back/pyproject.toml'
      - 'back/poetry.lock'
      - 'back/Dockerfile'
      - 'back/.dockerignore'
      - 'back/docker-compose.yml'
      - 'front/package.json'
      - 'front/package-lock.json'
      - 'front/Dockerfile'
      - 'front/nginx.conf'
      - 'SECURITY.md'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'back/pyproject.toml'
      - 'back/poetry.lock'
      - 'back/Dockerfile'
      - 'back/.dockerignore'
      - 'back/docker-compose.yml'
      - 'front/package.json'
      - 'front/package-lock.json'
      - 'front/Dockerfile'
      - 'front/nginx.conf'
      - 'SECURITY.md'
      - '.github/workflows/security.yml'

jobs:
  frontend-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: front
        run: npm audit --audit-level=high

  backend-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry==2.1.3

      - name: Check lock file
        working-directory: back
        run: poetry check --lock

      - name: Install backend dependencies
        working-directory: back
        run: poetry install --no-interaction

      - name: Export installed packages
        working-directory: back
        run: poetry run pip list --format=freeze > backend-requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies
        working-directory: back
        run: pip-audit --requirement backend-requirements.txt
