name: Frontend

on:
  push:
    paths:
      - 'front/**'
      - 'Makefile'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'front/**'
      - 'Makefile'
      - '.github/workflows/frontend.yml'

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Check types
        working-directory: front
        run: npm run typecheck

      - name: Check lint
        working-directory: front
        run: npm run lint

      - name: Run tests
        working-directory: front
        run: npm run test

      - name: Build frontend
        working-directory: front
        run: npm run build

      - name: Build production image
        run: docker build --build-arg VITE_API_URL=http://localhost:8000 -t domain-analyzer-front:ci front

      - name: Smoke test production image
        run: |
          docker run --detach --name domain-analyzer-front-smoke --publish 4173:80 domain-analyzer-front:ci
          trap 'docker rm --force domain-analyzer-front-smoke' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
